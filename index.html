
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBERKING PORTAL</title>
<style>
  body { background: black; color: white; text-align: center; font-family: Arial; margin: 0; padding: 20px; }
  h1 { color: #FFD700; font-size: 32px; margin-top: 40px; }
  p { font-size: 18px; }
  .bigbtn { background: #FFD700; color: black; font-size: 22px; font-weight: bold; padding: 18px 30px; border: none; border-radius: 8px; margin-top: 20px; }
  #popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; overflow-y: auto; }
  #box { padding: 20px; }
  #box h2 { color: #FFD700; font-size: 28px; }
  .card { background: #111; border: 1px solid #FFD700; border-radius: 12px; padding: 20px; margin: 15px 0; }
  .card h3 { color: #FFD700; margin: 0 0 10px 0; }
  .card a { display: block; background: #FFD700; color: black; font-weight: bold; text-decoration: none; padding: 14px; border-radius: 8px; margin: 10px 0; font-size: 18px; }
  .closebtn { background: white; color: black; font-size: 18px; font-weight: bold; padding: 12px 25px; border: none; border-radius: 8px; margin-top: 10px; }
</style>
</head>
<body>

<h1>👑 CYBERKING PORTAL 👑</h1>
<p>Welcome King. Your portal is LIVE.</p>
<button class="bigbtn" onclick="document.getElementById('popup').style.display='block'">ENTER PORTAL</button>

<div id="popup">
  <div id="box">
    <h2>👑 WELCOME KING 👑</h2>
    <p>You are IN. This is your world now.</p>

    <div class="card">
      <h3>🎬 MY VIDEOS</h3>
      <a href="https://www.tiktok.com" target="_blank">Watch My TikTok</a>
      <a href="https://www.youtube.com" target="_blank">Watch My YouTube</a>
    </div>

    <div class="card">
      <h3>📱 FOLLOW ME</h3>
      <a href="https://www.instagram.com" target="_blank">Instagram</a>
      <a href="https://wa.me/1234567890" target="_blank">WhatsApp Me</a>
    </div>

    <div class="card">
      <h3>👑 ABOUT THE KING</h3>
      <p>I am CyberKing. This is my portal. Welcome to my world.</p>
    </div>

    <button class="closebtn" onclick="document.getElementById('popup').style.display='none'">CLOSE / EXIT PORTAL</button>
  </div>
</div>

</body>
</html>
